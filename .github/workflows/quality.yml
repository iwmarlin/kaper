name: Quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rebuild, validate, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          check-latest: false

      - name: Install site build dependencies
        run: python -m pip install --requirement requirements-site.txt

      - name: Rebuild and validate every generated layer
        run: python scripts/rebuild_site.py --root .

      - name: Verify that generated files were committed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The canonical rebuild changed tracked files or created untracked files. Run 'python3 scripts/rebuild_site.py --root .' locally and commit every intended generated result."
            git status --short
            git diff --stat
            exit 1
          fi

      - name: Run the complete regression suite
        run: python -m unittest discover --start-directory tests --verbose
